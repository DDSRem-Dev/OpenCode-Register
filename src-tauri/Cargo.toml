[package]
name = "opencode-register"
version = "0.0.6"
description = "Desktop account manager for OpenCode"
authors = ["OpenCode Register contributors"]
edition = "2021"

[lib]
name = "opencode_register_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
