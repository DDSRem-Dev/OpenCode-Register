[project]
name = "opencode-register-backend"
version = "0.0.1"
description = "Local automation service for OpenCode Register"
requires-python = ">=3.11"
dependencies = [
  "cloakbrowser>=0.5.1,<0.6",
  "cryptography>=45,<50",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["C901", "D101", "D102", "D103", "E", "F", "I", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
strict = true
exclude = [".venv", ".ruff_cache", ".pytest_cache"]
warn_unused_configs = true
